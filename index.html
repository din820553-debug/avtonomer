<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>AVTONOMER WORLD</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><div><div class="brand">AVTONOMER WORLD</div><div class="eyebrow">GLOBAL PLATE HUNT</div></div><div class="wallet"><div class="pill cash" id="balance">0 ₽</div><div class="pill" id="garageCount">Гараж 0</div></div></header><section class="hero"><div class="toolbar"><label>Страна <select id="country"><option value="WORLD">🌍 Весь мир</option><option value="RU">🇷🇺 Россия</option><option value="DE">🇩🇪 Германия</option><option value="US">🇺🇸 США</option><option value="GB">🇬🇧 Великобритания</option><option value="JP">🇯🇵 Япония</option><option value="AE">🇦🇪 ОАЭ</option><option value="FR">🇫🇷 Франция</option><option value="IT">🇮🇹 Италия</option><option value="NL">🇳🇱 Нидерланды</option><option value="CH">🇨🇭 Швейцария</option><option value="PL">🇵🇱 Польша</option><option value="KZ">🇰🇿 Казахстан</option></select></label></div><div class="countryName" id="countryName">Россия</div><div class="plate" id="plate"><i class="bolt b1"></i><i class="bolt b2"></i><div class="number" id="num">А 001 АА</div><div class="region"><span id="reg">77</span><span class="rus" id="countryMark">🇷🇺 RUS</span></div></div><div class="info"><div class="rarity" id="rarity">—</div><div class="value" id="value">—</div></div><div class="actions"><button class="primary" id="roll">⚡ Искать номер</button><button class="save" id="keep">＋ В гараж</button><button class="sell" id="quickSell">₽ Продать</button></div><div class="hint">Форматы стилизованы под страны. Цены полностью игровые и не являются реальной оценкой номера.</div></section><section class="stats"><div class="stat"><b id="rolls">0</b><span>поисков</span></div><div class="stat"><b id="best">0 ₽</b><span>лучший улов</span></div><div class="stat"><b i
