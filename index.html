<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>AVTONOMER — охота за красивыми номерами</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><div><div class="brand">AVTONOMER</div><div class="eyebrow">RUSSIA PLATE HUNT</div></div><div class="wallet"><div class="pill cash" id="balance">0 ₽</div><div class="pill" id="garageCount">Гараж 0</div></div></header><section class="hero"><div class="eyebrow">ПОЙМАЙ РЕДКИЙ НОМЕР</div><div class="plate" id="plate"><i class="bolt b1"></i><i class="bolt b2"></i><div class="number" id="num">А 001 АА</div><div class="region"><span id="reg">77</span><span class="rus">RUS <i class="flag"></i></span></div></div><div class="info"><div class="rarity" id="rarity">—</div><div class="value" id="value">—</div></div><div class="actions"><button class="primary" id="roll">⚡ Искать номер</button><button class="save" id="keep">＋ В гараж</button><button class="sell" id="quickSell">₽ Продать</button></div><div class="hint">Все цены условные и являются частью игры, а не оценкой реальной стоимости госномеров.</div></section><section class="stats"><div class="stat"><b id="rolls">0</b><span>поисков</span></div><div class="stat"><b id="best">0 ₽</b><span>лучший улов</span></div><div class="stat"><b id="sold">0</b><span>продано</span></div><div class="stat"><b id="legendary">0</b><span>легендарных</span></div></section><div class="tabs"><h2>Мой гараж</h2><button class="filter active" data-f="all">Все</button><button class="filter" data-f="rare">Редкие+</button><button class="filter" data-f="legend">Легенды</button></div><div class="grid" id="garage"></div></main><div class="toast" id="toast"></div><script src="game.js"></script></body></html>
